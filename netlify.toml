[build]
  publish = "."

[[edge_functions]]
  path = "/perfil.html"
  function = "perfil-seo"

[[edge_functions]]
  path = "/perfil"
  function = "perfil-seo"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(self), camera=(self), microphone=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/db.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/fieldo.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from   = "/codes.html"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/admin.html"
  to     = "/index.html"
  status = 404
  force  = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
